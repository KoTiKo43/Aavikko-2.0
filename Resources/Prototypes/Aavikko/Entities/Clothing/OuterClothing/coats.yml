- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatTrenchSecurity
  name: тренчкот службы безопасности
  description: Создан, чтобы одолевать преступников своей статусностью. Великолепно смотрится вместе с фуражкой.
  suffix: Aavikko
  components:
  - type: Sprite
    sprite: Aavikko/Clothing/OuterClothing/Coats/security_trenchcoat.rsi
  - type: Clothing
    sprite: Aavikko/Clothing/OuterClothing/Coats/security_trenchcoat.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 20
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95

- type: entity
  parent: [ClothingOuterCoatTrench, ClothingOuterStorageFoldableBase]
  id: ClothingOuterCoatTrenchBlack
  name: чёрный тренчкот
  description: Комфортный чёрный тренчкот.
  suffix: Aavikko
  components:
  - type: Sprite
