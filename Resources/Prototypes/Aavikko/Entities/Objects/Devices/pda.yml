- type: entity
  parent: BasePDA
  id: SecretarianPDA
  name: secretarian PDA
  description: Suitable for starting with a clean slate.
  suffix: Aavikko
  components:
  - type: Pda
    id: SecretarianIDCard
    penSlot:
      startingItem: LuxuryPen
      priority: -1
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-secretarian
  - type: PdaBorderColor
    borderColor: "#22b3c9"
  - type: Sprite
    sprite: Aavikko/Objects/Devices/pda.rsi
    state: pda-secretarian
  - type: Icon
    path: Aavikko/Objects/Devices/pda.rsi
    state: pda-secretarian

- type: entity
  parent: BaseSecurityPDA
  id: BRLCapPDA
  name: BRL Captain PDA
  description: Gray for coordination.
  suffix: Aavikko, BRL
  components:
  - type: Pda
    id: BRLCapIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-cap
  - type: PdaBorderColor
    borderColor: "#3D5572"
  - type: Sprite
    sprite: Aavikko/Objects/Devices/pda_brl.rsi
    state: pda-cap
  - type: Icon
    path: Aavikko/Objects/Devices/pda_brl.rsi
    state: pda-cap
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: MedTekCartridge
        - id: WantedListCartridge
        - id: LogProbeCartridge
        - id: AstroNavCartridge

