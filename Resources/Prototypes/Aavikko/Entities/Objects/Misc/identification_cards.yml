- type: entity
  parent: IDCardStandard
  id: SecretarianIDCard
  name: secretarian ID card
  suffix: Aavikko
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: &color-command-top "#404783"
    - state: stripe_bottom
      color: &color-command-bottom "#332f58"
    - state: job_icon_top
      color: *color-command-top
    - state: job_icon_bottom
      color: *color-command-bottom
    - sprite: &icon-rsi Aavikko/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.1875, 0 # 6 pixels left
      state: Secretarian
  - type: PresetIdCard
    job: Secretarian

- type: entity
  parent: IDCardStandard
  id: BRLCapIDCard
  name: BRL Captain ID card
  suffix: Aavikko, BRL
  components:
  - type: Sprite
    sprite: Aavikko/Objects/Misc/id_cards.rsi
    layers:
    - state: brl
    - state: stripe_top
      color: &color-centcomm-top "#332f58"
    - state: stripe_bottom
      color: &color-centcomm-bottom "#272545"
    - state: job_icon_top
      color: *color-centcomm-top
    - state: job_icon_bottom
      color: *color-centcomm-bottom
    - sprite: *icon-rsi
      offset: *icon-offset
      state: BRLCaptain
  - type: Item
    heldPrefix: brl
  - type: PresetIdCard
    job: BRLCaptain

