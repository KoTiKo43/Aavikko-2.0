  components:
  - type: GibbableOrgan
  - type: Organ
    category: Eyes
  - type: Sprite
    sprite: Objects/Misc/proximity_sensor.rsi
    state: icon
  - type: VisualOrgan  # Aavikko: render eyes on humanoid body
    layer: enum.HumanoidVisualLayers.Eyes
    data:
      sprite: Mobs/Customization/eyes.rsi
      state: eyes