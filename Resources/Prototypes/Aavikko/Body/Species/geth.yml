- type: markingsGroup
  parent: Undergarments
  id: Geth
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ GethArmorHead ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: true
      default: [ GethArmorChest ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: true
      default: [ GethArmorLArm ]
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
      default: [ GethArmorRArm ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: true
      default: [ GethArmorLLeg ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: true
      default: [ GethArmorRLeg ]
    enum.HumanoidVisualLayers.LHand:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGeth
  categories: [ HideSpawnMenu ]
  name: Geth appearance
  components:
  - type: Inventory
    templateId: geth
  - type: InitialBody
    organs:
      Torso: OrganGethTorso
      Head: OrganGethHead
      ArmLeft: OrganGethArmLeft
      ArmRight: OrganGethArmRight
      HandRight: OrganGethHandRight
      HandLeft: OrganGethHandLeft
      LegLeft: OrganGethLegLeft
      LegRight: OrganGethLegRight
      FootLeft: OrganGethFootLeft
      FootRight: OrganGethFootRight
      Eyes: OrganGethEyes
  - type: HumanoidProfile
    species: Geth

- type: entity
  parent:
  - AppearanceGeth
  - BaseSpeciesMobSynthetic
  id: MobGeth
  name: Urist McGeth
  save: false
  components:
  - type: Icon
    sprite: Aavikko/Mobs/Species/Get/parts.rsi
    state: full
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: Damageable
    damageModifierSet: GethDamageSet
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808080"
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 15
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Geth
    - Binary
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: ActiveRadio
    channels:
    - Geth
    - Binary
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: Geth
    entityProduced: GethEmag
    action: GethEmagCreate
  - type: Repairable
    doAfterDelay: 15
  - type: ZombieImmune
    entityProduced: GethEmag
    action: GethEmagCreate
  - type: Insulated
  - type: ProtectedFromStepTriggers
  - type: Speech
    speechVerb: Robotic
    speechSounds: GethVoice
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepGeth
  - type: Vocal
    sounds:
      Unsexed: UnisexGeth
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - Geth
    - Unimplantable

