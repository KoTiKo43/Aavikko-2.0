# Органы таракана. Не наследуют OrganBaseXxx, поэтому у них НЕТ GibbableOrgan.
# При гибе таракана эти органы остаются внутри тела и удаляются вместе с ним,
# а не выпадают на пол как человеческие.

- type: entity
  parent: [ OrganAnimal, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganCockroachLungs
  components:
  - type: Organ
    category: Lungs
  - type: Lung

- type: entity
  parent: [ OrganAnimal, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganCockroachHeart
  components:
  - type: Organ
    category: Heart

- type: entity
  parent: [ OrganAnimal, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganCockroachStomach
  components:
  - type: Organ
    category: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 30
  - type: FlavorProfile

- type: entity
  parent: [ OrganAnimal, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganCockroachLiver
  components:
  - type: Organ
    category: Liver

- type: entity
  parent: [ OrganAnimal, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganCockroachKidneys
  components:
  - type: Organ
    category: Kidneys
